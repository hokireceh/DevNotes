<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevNotes Pro — Preview</title>
  <style>
    :root {
      --bg-0: #0a0b14;
      --bg-1: #11131e;
      --bg-2: #181a26;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-default: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #e8e9f3;
      --text-secondary: #a0a3b8;
      --text-tertiary: #6b6e85;
      --text-muted: #4a4d63;
      --accent: #7c5cff;
      --accent-hover: #9c82ff;
      --accent-glow: rgba(124, 92, 255, 0.35);
      --accent-soft: rgba(124, 92, 255, 0.12);
      --accent-gradient: linear-gradient(135deg, #7c5cff 0%, #5b3df5 100%);
      --code-color: #67e8f9;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 20px;
      --r-full: 999px;
      --t-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable",
                   "Segoe UI", "Inter", system-ui, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 92, 255, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(91, 61, 245, 0.12), transparent 45%),
        var(--bg-0);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
      gap: 8px;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow:
        0 12px 36px rgba(124, 92, 255, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.3);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #c4b5fd 0%, #7c5cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 14px;
    }

    .page-sub {
      color: var(--text-tertiary);
      font-size: 13px;
      margin-bottom: 28px;
      text-align: center;
      letter-spacing: -0.005em;
    }

    .phone-frame {
      position: relative;
      border-radius: var(--r-xl);
      padding: 8px;
      background:
        linear-gradient(135deg,
          rgba(124, 92, 255, 0.4),
          rgba(91, 61, 245, 0.15) 40%,
          rgba(255, 255, 255, 0.04) 80%);
      box-shadow:
        0 20px 60px rgba(124, 92, 255, 0.25),
        0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .phone-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--r-xl);
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }

    iframe {
      display: block;
      border: none;
      width: 380px;
      height: 560px;
      border-radius: 14px;
      background: var(--bg-0);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <img src="/ext/icons/icon128.png" class="brand-mark" alt="DevNotes Pro" />
  <h1 class="page-title">DevNotes Pro</h1>
  <p class="page-sub">Chrome Extension · Preview Interaktif</p>

  <div class="phone-frame">
    <iframe src="/ext/popup.html" title="Extension Popup"></iframe>
  </div>
</body>
</html>
